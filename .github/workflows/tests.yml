name: tests

on:
    pull_request:
    push:
        branches: [main]

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4.1.7
            - uses: actions/setup-node@v4.0.3
              with:
                  node-version-file: '.nvmrc'
            - run: npm ci
            - run: npm run test:all
            - run: npm run build
